  en: First Dutch expedition to the East Indies
summary:
  zh-TW: 豪特曼率荷蘭第一支船隊前往東印度，抵達爪哇的萬丹。這趟航行雖然損失慘重，卻證明荷蘭可以直接前往亞洲取得香料。
  en: Cornelis de Houtman led the first Dutch fleet to the East Indies and reached Banten on Java. Despite heavy losses, the voyage proved the Dutch could reach the Asian spice trade directly.
