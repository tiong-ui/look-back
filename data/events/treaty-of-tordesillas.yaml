id: treaty-of-tordesillas
title:
  zh-TW: 托德西利亞斯條約
  en: Treaty of Tordesillas
summary:
  zh-TW: 西班牙與葡萄牙簽訂《托德西利亞斯條約》，以維德角群島以西370里格（約西經46度）的經線瓜分新發現的土地：線以西歸西班牙，線以東歸葡萄牙。
  en: "Spain and Portugal divided newly found lands along a meridian 370 leagues west of the Cape Verde islands (about 46°W): west of the line to Spain, east of it to Portugal."
