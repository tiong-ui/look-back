id: takasago-volunteers
title:
  zh-TW: 高砂義勇隊
  en: Takasago Volunteers
summary:
  zh-TW: 日軍從臺灣原住民族中招募「高砂義勇隊」，派往菲律賓、新幾內亞等南洋叢林作戰，前後數千人參加，許多人沒能返鄉。
  en: The Japanese army recruited Taiwan's Indigenous peoples into the Takasago Volunteers and sent them to fight in the jungles of the Philippines, New Guinea and elsewhere. Several thousand served, and many never came home.
