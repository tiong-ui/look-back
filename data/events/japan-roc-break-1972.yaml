id: japan-roc-break-1972
title:
  zh-TW: 日華斷交
  en: Japan breaks relations with the ROC
summary:
  zh-TW: 日本與中華人民共和國簽署《中日聯合聲明》建交，同一天中華民國宣布與日本斷交。同年12月，雙方分別成立「交流協會」與「亞東關係協會」，以民間名義維持實質關係。
  en: Japan established relations with the People's Republic of China through a joint communiqué, and the ROC broke off relations with Japan the same day. In December the two sides set up private bodies, the Interchange Association and the Association of East Asian Relations, to keep ties going.
