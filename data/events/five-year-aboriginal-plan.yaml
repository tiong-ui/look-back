id: five-year-aboriginal-plan
title:
  zh-TW: 五年理蕃計畫
  en: Five-Year Plan to Subjugate the Aborigines
summary:
  zh-TW: 第五任總督佐久間左馬太推動「五年理蕃計畫」，以軍警武力推進山區的「隘勇線」，壓制尚未歸順的原住民族部落並收繳槍枝。
  en: Governor-General Sakuma Samata's five-year plan used troops and police to push guarded lines deep into the mountains, subduing Indigenous villages that had not submitted and confiscating their guns.
