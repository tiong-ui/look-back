  en: Ming dynasty
summary:
  zh-TW: 朱元璋推翻元朝建立明朝，初都南京，永樂帝遷都北京。明朝長期實施海禁，間接促成東亞海上走私貿易與海商集團的興起。
  en: Zhu Yuanzhang overthrew the Yuan and founded the Ming, first ruling from Nanjing; the Yongle Emperor moved the capital to Beijing. Long-running sea bans fed the rise of smuggling and armed merchant fleets across East Asian waters.
