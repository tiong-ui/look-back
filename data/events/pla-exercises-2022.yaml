summary:
  zh-TW: 美國眾議院議長裴洛西訪臺後，中國在臺灣周邊多個海域實施大規模軍演並試射飛彈，部分飛彈越過臺灣上空，落入日本專屬經濟區。
  en: After US House Speaker Nancy Pelosi visited Taiwan, China held large-scale exercises in several zones around Taiwan and test-fired missiles, some flying over Taiwan and landing in Japan's exclusive economic zone.
