id: koxinga-born-hirado
title:
  zh-TW: 鄭成功生於日本平戶
  en: Koxinga born in Hirado, Japan
summary:
  zh-TW: 鄭成功生於日本肥前平戶，父親是海商鄭芝龍，母親是日本人田川氏。他在平戶度過童年，七歲時才前往中國。日後他率軍驅逐荷蘭人，建立東寧王國。
  en: Koxinga was born in Hirado, Japan, to the maritime trader Zheng Zhilong and a Japanese mother of the Tagawa family. He spent his early childhood in Hirado before moving to China at seven. He later drove the Dutch from Taiwan and founded the Kingdom of Tungning.
