summary:
  zh-TW: 明朝宦官鄭和率領龐大艦隊七次出航，遠達東南亞、印度、波斯灣與東非，宣揚國威並建立朝貢關係，之後明朝轉向收縮。
  en: The Ming eunuch Zheng He led huge fleets on seven voyages to Southeast Asia, India, the Persian Gulf and East Africa to project power and gather tribute, after which the Ming turned inward.
