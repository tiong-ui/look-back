id: truku-war-1914
title:
  zh-TW: 太魯閣戰役
  en: Truku War
summary:
  zh-TW: 日本動員上萬名軍警，進攻花蓮山區的太魯閣族部落，是五年理蕃計畫中規模最大的戰役。太魯閣族頑強抵抗，最終被迫歸順。
  en: Japan mobilised more than ten thousand soldiers and police against the Truku villages in the Hualien mountains, the largest campaign of the five-year plan. The Truku resisted fiercely but were forced to submit.
