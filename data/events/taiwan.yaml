# Taiwan events. Format: see docs/DATA.md.
# Years are astronomical (1 BC = 0, 2 BC = -1). `start`/`end` may be a bare
# year or { year, month, day }.
# `importance` is an editor estimate (1–5) used until the Wikipedia-based
# score has been computed (npm run importance).

# ===== Prehistory ===============================================================

- id: changbin-culture
  title: { zh-TW: 長濱文化, en: Changbin culture }
  summary:
    zh-TW: 臺灣已知最早的舊石器時代文化，以臺東八仙洞遺址為代表。當時臺灣海峽因冰期海平面下降而部分露出，人群以打製石器狩獵採集維生。
    en: Taiwan's earliest known Paleolithic culture, best known from the Baxian Caves in Taitung. During the Ice Age, lower seas partly exposed the Taiwan Strait, and people lived by hunting and gathering with chipped-stone tools.
  start: -27999
  end: -2999
  precision: millennium
  approximate: true
  categories: [prehistory]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: changbin, role: primary }
  relations:
    - { event: dapenkeng-culture, type: precedes }
  wikipedia: { en: Changbin culture, zh: 長濱文化 }
  sources:
    - { resource: nmp }

- id: dapenkeng-culture
  title: { zh-TW: 大坌坑文化, en: Dapenkeng culture }
  summary:
    zh-TW: 臺灣最早的新石器時代文化（約距今六千年前），帶有繩紋陶器，普遍被視為南島語族祖先的文化之一。
    en: Taiwan's earliest Neolithic culture (about 6,000 years ago), known for cord-marked pottery and widely seen as ancestral to Austronesian-speaking peoples.
  start: -3999
  end: -2499
  precision: millennium
  approximate: true
  categories: [prehistory]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: dapenkeng, role: primary }
  relations:
    - { event: austronesian-expansion, type: causes }
  wikipedia: { en: Dapenkeng culture, zh: 大坌坑文化 }

- id: austronesian-expansion
  title: { zh-TW: 南島語族自臺灣向外擴散, en: Austronesian expansion from Taiwan }
  altNames:
    - { zh-TW: 出臺灣說, en: Out of Taiwan model }
  summary:
    zh-TW: 依語言學與考古學的主流假說，南島語族自臺灣出發，經菲律賓擴散至東南亞島嶼、太平洋與印度洋，成為世界上分布最廣的語族之一。臺灣原住民族語言保存了南島語最古老的分支。
    en: In the leading linguistic and archaeological model, Austronesian speakers set out from Taiwan through the Philippines into Island Southeast Asia, the Pacific and the Indian Ocean, becoming one of the most widespread language families. Taiwan's Indigenous languages preserve its oldest branches.
  start: -2499
  end: -899
  precision: century
  approximate: true
  categories: [migration, prehistory]
  regions: [taiwan, southeast-asia, pacific]
  importance: 4
  locations:
    - { place: taiwan, role: origin }
    - { place: batanes, role: destination }
    - { place: manila, role: destination }
    - { place: sulawesi, role: destination }
    - { place: fiji, role: destination }
  perspectives:
    - view: scholarly
      text:
        zh-TW: 「出臺灣說」是目前最受支持的模型，但也有學者主張東南亞島嶼本身扮演更重要的角色，或擴散路線更為複雜。
        en: '"Out of Taiwan" is the best-supported model, but some scholars argue Island Southeast Asia played a larger role, or that the routes were more complex.'
    - view: indigenous
      text:
        zh-TW: 對臺灣原住民族而言，這段歷史確立了臺灣作為南島世界原鄉的地位，也是族群認同的重要基礎。
        en: For Taiwan's Indigenous peoples, this history establishes Taiwan as the homeland of the Austronesian world and is an important part of identity.
  wikipedia: { en: Austronesian peoples, zh: 南島民族 }

- id: beinan-culture
  title: { zh-TW: 卑南文化, en: Beinan culture }
  summary:
    zh-TW: 臺灣東部的新石器時代晚期文化，以大量石板棺與精美玉器聞名，臺東卑南遺址是東南亞規模最大的石板棺墓葬群之一。
    en: A late Neolithic culture of eastern Taiwan, known for its many slate coffins and fine jade. The Beinan site in Taitung is one of the largest slate-coffin cemeteries in Southeast Asia.
  start: -1499
  end: -299
  precision: century
  approximate: true
  categories: [prehistory, culture]
  regions: [taiwan]
  importance: 2
  locations:
    - { place: beinan, role: primary }
  wikipedia: { en: Beinan culture, zh: 卑南文化 }
  sources:
    - { resource: nmp }

- id: taiwan-jade-network
  title: { zh-TW: 臺灣玉的海上交流網絡, en: Maritime jade network from Taiwan }
  summary:
    zh-TW: 花蓮豐田出產的閃玉被製成耳飾等器物，廣泛流通於菲律賓、越南、泰國與婆羅洲，顯示臺灣早在數千年前就是東南亞海上交流的一環。
    en: Nephrite from Fengtian in Hualien was made into ear ornaments and other objects that circulated across the Philippines, Vietnam, Thailand and Borneo, showing Taiwan was part of Southeast Asian maritime exchange thousands of years ago.
  start: -1999
  end: 500
  precision: century
  approximate: true
  categories: [trade, prehistory]
  regions: [taiwan, southeast-asia]
  importance: 2
  locations:
    - { place: fengtian, role: origin }
    - { place: manila, role: destination }
    - { place: sa-huynh, role: destination }
  wikipedia: { en: Maritime Jade Road }

- id: shisanhang-culture
  title: { zh-TW: 十三行文化, en: Shisanhang culture }
  summary:
    zh-TW: 臺灣北部的鐵器時代文化，十三行遺址出土煉鐵遺跡，以及來自中國與東南亞的錢幣、玻璃珠等貿易品，與凱達格蘭族的祖先有關。
    en: An Iron Age culture of northern Taiwan. The Shisanhang site has iron-smelting remains and traded goods such as coins and glass beads from China and Southeast Asia; it is linked to the ancestors of the Ketagalan people.
  start: 200
  end: 1500
  precision: century
  approximate: true
  categories: [prehistory, trade]
  regions: [taiwan]
  importance: 2
  locations:
    - { place: shisanhang, role: primary }
  wikipedia: { en: Shisanhang Museum of Archaeology, zh: 十三行文化 }

# ===== Early records (contested identifications) ===============================

- id: wu-yizhou-expedition
  title: { zh-TW: 孫權遣軍至「夷洲」, en: Eastern Wu expedition to "Yizhou" }
  summary:
    zh-TW: 東吳孫權派衛溫、諸葛直率萬人渡海尋找「夷洲」，擄回數千人，但軍隊因疫病折損大半。「夷洲」是否即為臺灣，學界仍有爭議；此行亦未在當地建立任何統治。
    en: Sun Quan of Eastern Wu sent Wei Wen and Zhuge Zhi with ten thousand troops across the sea to "Yizhou". They brought back several thousand captives, but disease killed most of the army. Whether Yizhou was Taiwan is still debated, and no rule was set up there.
  start: 230
  precision: year
  categories: [war, migration]
  regions: [taiwan, china]
  importance: 2
  locations:
    - { place: nanjing, role: origin }
    - { place: taiwan, role: destination }
  relations:
    - { event: sui-liuqiu-expeditions, type: related }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 這是一次擄掠人口的軍事行動，即使「夷洲」確為臺灣，也不代表任何政權在臺灣建立了統治。
        en: This was a raid to capture people. Even if Yizhou was Taiwan, it does not mean any state established rule over Taiwan.
    - view: prc
      text:
        zh-TW: 中國官方常以此作為「臺灣自古屬於中國」的早期證據。
        en: Chinese official accounts often cite it as early evidence that "Taiwan has belonged to China since ancient times".
    - view: scholarly
      text:
        zh-TW: 「夷洲」的位置有臺灣、琉球、日本等多種說法，現存史料不足以定論。
        en: Yizhou has been identified with Taiwan, Ryukyu or Japan; surviving sources cannot settle it.
  wikipedia: { en: Yizhou (Taiwan), zh: 夷州 }

- id: sui-liuqiu-expeditions
  title: { zh-TW: 隋朝出兵「流求」, en: Sui expeditions to "Liuqiu" }
  summary:
    zh-TW: 隋煬帝先後派朱寬、陳稜前往「流求」，610年陳稜攻破當地聚落並擄回數千人。「流求」指臺灣還是琉球群島，至今沒有定論。
    en: Emperor Yang of Sui sent Zhu Kuan and then Chen Leng to "Liuqiu". In 610 Chen Leng sacked a settlement there and took several thousand captives. Whether Liuqiu meant Taiwan or the Ryukyu Islands is unresolved.
  start: 607
  end: 610
  precision: year
  categories: [war]
  regions: [taiwan, china]
  importance: 1
  locations:
    - { place: changan, role: origin }
    - { place: taiwan, role: destination }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 與東吳的行動相同，屬一次性的劫掠遠征，並未形成統治。
        en: Like the Wu expedition, it was a one-off raid that established no rule.
    - view: scholarly
      text:
        zh-TW: 學者對「流求」究竟是臺灣或沖繩意見分歧。
        en: Scholars are divided on whether Liuqiu was Taiwan or Okinawa.
  wikipedia: { en: Liuqiu (Taiwan), zh: 流求 }

- id: ilha-formosa
  title: { zh-TW: 「福爾摩沙」之名出現, en: The name "Ilha Formosa" }
  summary:
    zh-TW: 十六世紀中葉，航經臺灣的葡萄牙水手稱其為「Ilha Formosa（美麗之島）」，此名隨後出現在歐洲地圖上，成為臺灣在西方世界的名稱。確切年份已無從考證。
    en: In the mid-16th century, Portuguese sailors passing Taiwan called it "Ilha Formosa" (beautiful island). The name spread through European maps and became Taiwan's name in the West. The exact year is unknown.
  start: 1540
  precision: decade
  approximate: true
  categories: [migration]
  regions: [taiwan]
  importance: 2
  locations:
    - { place: taiwan, role: primary }
  wikipedia: { en: Names of Taiwan, zh: 台灣名稱 }

# ===== Dutch, Spanish and Tungning eras ========================================

- id: dutch-formosa
  title: { zh-TW: 荷蘭統治臺灣, en: Dutch Formosa }
  summary:
    zh-TW: 荷蘭東印度公司先占據澎湖，被明朝驅離後於1624年轉往大員（今臺南安平）建立熱蘭遮城，以臺灣為東亞貿易據點，並引進大量漢人移民開墾。這是臺灣第一個有系統的殖民政權。
    en: The Dutch East India Company first occupied Penghu, then, pushed out by the Ming, moved in 1624 to Tayouan (now Anping, Tainan), where it built Fort Zeelandia. It used Taiwan as an East Asian trading base and brought in many Han settlers to farm. It was the first organised colonial regime in Taiwan.
  start: 1624
  end: 1662
  precision: year
  categories: [dynasty, trade]
  regions: [taiwan, southeast-asia]
  importance: 5
  locations:
    - { place: tainan-anping, role: primary }
    - { place: tainan, role: secondary }
    - { place: penghu, role: secondary }
    - { place: batavia, role: origin }
    - { place: tainan-anping, role: destination }
  relations:
    - { event: spanish-formosa, type: related }
  wikipedia: { en: Dutch Formosa, zh: 荷蘭統治時期 }
  sources:
    - { resource: andrade-how-taiwan }

- id: spanish-formosa
  title: { zh-TW: 西班牙占領北臺灣, en: Spanish Formosa }
  summary:
    zh-TW: 西班牙自馬尼拉出兵，於雞籠（今基隆和平島）建聖薩爾瓦多城，並在淡水建聖多明哥城，與荷蘭競爭東亞貿易；1642年被荷蘭逐出。
    en: Spain sent forces from Manila and built Fort San Salvador at Kelang (now Heping Island, Keelung) and Fort Santo Domingo at Tamsui, to compete with the Dutch for East Asian trade. The Dutch drove them out in 1642.
  start: 1626
  end: 1642
  precision: year
  categories: [dynasty, war]
  regions: [taiwan, southeast-asia]
  importance: 3
  locations:
    - { place: keelung, role: primary }
    - { place: tamsui, role: secondary }
    - { place: manila, role: origin }
    - { place: keelung, role: destination }
  relations:
    - { event: dutch-formosa, type: related }
  wikipedia: { en: Spanish Formosa, zh: 西班牙統治時期 }

- id: guo-huaiyi-rebellion
  title: { zh-TW: 郭懷一事件, en: Guo Huaiyi rebellion }
  summary:
    zh-TW: 不滿荷蘭東印度公司重稅與欺壓的漢人農民在郭懷一領導下起事，數千人遭荷軍與其原住民盟軍鎮壓殺害。
    en: Han farmers angered by the Dutch East India Company's heavy taxes and abuses rose up under Guo Huaiyi. The Dutch and their Indigenous allies crushed the revolt and killed thousands.
  start: { year: 1652, month: 9 }
  precision: month
  categories: [war]
  regions: [taiwan]
  importance: 2
  locations:
    - { place: tainan, role: primary }
  relations:
    - { event: dutch-formosa, type: part_of }
  wikipedia: { en: Guo Huaiyi rebellion, zh: 郭懷一事件 }

- id: siege-of-fort-zeelandia
  title: { zh-TW: 熱蘭遮城之役, en: Siege of Fort Zeelandia }
  summary:
    zh-TW: 鄭成功率軍自廈門、金門渡海，圍攻荷蘭東印度公司的熱蘭遮城。九個月後荷軍投降，結束荷蘭在臺38年的統治。
    en: Koxinga's forces crossed from Xiamen and Kinmen and besieged the Dutch East India Company's Fort Zeelandia. After nine months the Dutch surrendered, ending 38 years of Dutch rule in Taiwan.
  start: { year: 1661, month: 4, day: 30 }
  end: { year: 1662, month: 2, day: 1 }
  precision: day
  categories: [war]
  regions: [taiwan]
  importance: 4
  locations:
    - { place: tainan-anping, role: primary }
    - { place: xiamen, role: origin }
    - { place: tainan-anping, role: destination }
  relations:
    - { event: dutch-formosa, type: part_of }
    - { event: kingdom-of-tungning, type: causes }
  wikipedia: { en: Siege of Fort Zeelandia, zh: 熱蘭遮城之役 }
  sources:
    - { resource: andrade-lost-colony }

- id: kingdom-of-tungning
  title: { zh-TW: 東寧王國, en: Kingdom of Tungning }
  altNames:
    - { zh-TW: 明鄭時期, en: Ming-Zheng era }
  summary:
    zh-TW: 鄭成功及其子孫在臺灣建立的政權，奉南明正朔但實際獨立運作，設承天府、推動屯田與貿易，是臺灣第一個以漢人為主的政權。
    en: The regime set up in Taiwan by Koxinga and his heirs. It nominally served the Southern Ming but in practice ran independently, setting up Chengtian prefecture and promoting military farming and trade. It was the first Han-led regime in Taiwan.
  start: 1661
  end: 1683
  precision: year
  categories: [dynasty]
  regions: [taiwan]
  importance: 4
  locations:
    - { place: tainan, role: primary }
    - { place: xiamen, role: secondary }
  relations:
    - { event: battle-of-penghu, type: precedes }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 「東寧王國」一名強調它是在臺灣獨立運作的政權，而非中國王朝的延伸。
        en: The name "Kingdom of Tungning" stresses that it was a regime operating independently in Taiwan, not an extension of a Chinese dynasty.
    - view: roc
      text:
        zh-TW: 中華民國教科書傳統上稱「明鄭時期」，強調其延續明朝、「反清復明」的性質。
        en: ROC textbooks traditionally say "Ming-Zheng era", stressing its continuation of the Ming and its anti-Qing cause.
    - view: prc
      text:
        zh-TW: 中國官方強調鄭成功「收復臺灣」、驅逐荷蘭殖民者的民族英雄形象。
        en: Chinese official accounts present Koxinga as a national hero who "recovered Taiwan" from Dutch colonisers.
  wikipedia: { en: Kingdom of Tungning, zh: 明鄭時期 }

- id: battle-of-penghu
  title: { zh-TW: 澎湖海戰與東寧降清, en: Battle of Penghu and Tungning's surrender }
  summary:
    zh-TW: 清朝水師提督施琅於澎湖擊潰東寧主力艦隊，同年鄭克塽投降，東寧王國滅亡，臺灣被納入清帝國版圖。
    en: Qing admiral Shi Lang destroyed Tungning's main fleet off Penghu. Zheng Keshuang surrendered the same year, ending the Kingdom of Tungning, and Taiwan was absorbed into the Qing empire.
  start: { year: 1683, month: 7 }
  end: { year: 1683, month: 10 }
  precision: month
  categories: [war]
  regions: [taiwan, china]
  importance: 4
  locations:
    - { place: penghu, role: primary }
    - { place: tainan, role: secondary }
  relations:
    - { event: qing-rule-taiwan, type: causes }
  wikipedia: { en: Battle of Penghu, zh: 澎湖海戰 }

# ===== Qing rule ================================================================

- id: qing-rule-taiwan
  title: { zh-TW: 清治時期, en: Qing rule of Taiwan }
  summary:
    zh-TW: 清帝國將臺灣設為福建省下的臺灣府，初期限制移民渡臺。大量閩粵移民仍持續湧入開墾，與原住民族發生土地衝突，民變頻仍，有「三年一小反，五年一大亂」之說。
    en: The Qing made Taiwan a prefecture of Fujian and at first restricted migration. Settlers from Fujian and Guangdong kept arriving anyway, clashing with Indigenous peoples over land, and revolts were so frequent that a saying ran "a small uprising every three years, a big one every five".
  start: 1683
  end: 1895
  precision: year
  categories: [dynasty]
  regions: [taiwan, china]
  importance: 4
  locations:
    - { place: tainan, role: primary }
    - { place: beijing, role: secondary }
  relations:
    - { event: treaty-of-shimonoseki, type: precedes }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 清帝國將臺灣視為邊陲，統治以防範為主，是由外來政權統治臺灣的一段時期。
        en: The Qing treated Taiwan as a frontier to be kept in check; it was a period of rule by an outside regime.
    - view: roc
      text:
        zh-TW: 中華民國史觀視此為臺灣正式納入中國版圖的開始。
        en: The ROC view sees this as the start of Taiwan's formal incorporation into China.
    - view: prc
      text:
        zh-TW: 中國官方以清朝的治理作為臺灣屬於中國的主要歷史依據之一。
        en: Chinese official accounts cite Qing rule as a main historical basis for Taiwan belonging to China.
  wikipedia: { en: Taiwan under Qing rule, zh: 臺灣清治時期 }

- id: zhu-yigui-uprising
  title: { zh-TW: 朱一貴事件, en: Zhu Yigui uprising }
  summary:
    zh-TW: 朱一貴於羅漢門起事，短時間內攻下臺灣府城並稱王，是清治初期規模最大的民變之一，約兩個月後遭清軍平定。
    en: Zhu Yigui rose up at Lohanmen, quickly took the prefectural capital and proclaimed himself king. One of the largest revolts of early Qing rule, it was put down after about two months.
  start: { year: 1721, month: 4 }
  end: { year: 1721, month: 6 }
  precision: month
  categories: [war]
  regions: [taiwan]
  importance: 2
  locations:
    - { place: neimen, role: primary }
    - { place: tainan, role: secondary }
  relations:
    - { event: qing-rule-taiwan, type: part_of }
  wikipedia: { en: Zhu Yigui, zh: 朱一貴事件 }

- id: lin-shuangwen-rebellion
  title: { zh-TW: 林爽文事件, en: Lin Shuangwen rebellion }
  summary:
    zh-TW: 天地會領袖林爽文於大里杙起事，戰火延燒全臺一年多，清廷調派福康安率大軍來臺才平定，是清治時期規模最大的民變。
    en: Heaven and Earth Society leader Lin Shuangwen rose up at Dalikit. Fighting spread across Taiwan for more than a year until the Qing sent Fuk'anggan with a large army. It was the largest revolt of the Qing era.
  start: { year: 1786, month: 11 }
  end: { year: 1788, month: 2 }
  precision: month
  categories: [war]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: dali, role: primary }
    - { place: chiayi, role: secondary }
  relations:
    - { event: qing-rule-taiwan, type: part_of }
  wikipedia: { en: Lin Shuangwen rebellion, zh: 林爽文事件 }

- id: taiwan-ports-opened
  title: { zh-TW: 臺灣開港通商, en: Taiwan's ports open to foreign trade }
  summary:
    zh-TW: 依《天津條約》等約定，淡水、雞籠、安平、打狗陸續開放對外通商，茶、糖、樟腦成為主要出口品，臺灣經濟重心逐漸北移。
    en: Under the Treaty of Tientsin and related agreements, Tamsui, Kelang, Anping and Takao opened to foreign trade. Tea, sugar and camphor became the main exports, and Taiwan's economic centre gradually shifted north.
  start: 1860
  end: 1863
  precision: year
  categories: [trade, diplomacy]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: tamsui, role: primary }
    - { place: keelung, role: secondary }
    - { place: tainan-anping, role: secondary }
    - { place: kaohsiung, role: secondary }
  wikipedia: { en: Treaty of Tientsin, zh: 天津條約 }

- id: mudan-incident
  title: { zh-TW: 牡丹社事件, en: Mudan incident }
  summary:
    zh-TW: 1871年琉球船員漂流至臺灣南部遭排灣族殺害，日本以此為由於1874年出兵恆春半島，與牡丹社等部落交戰。事件促使清廷加強治臺，也成為日本併吞琉球的藉口之一。
    en: In 1871 shipwrecked Ryukyuan sailors were killed by Paiwan people in southern Taiwan. Japan used this to send troops to the Hengchun Peninsula in 1874, fighting Mudan and other villages. It pushed the Qing to tighten control of Taiwan and gave Japan a pretext for annexing Ryukyu.
  start: { year: 1874, month: 5 }
  end: { year: 1874, month: 12 }
  precision: month
  categories: [war, diplomacy]
  regions: [taiwan, japan]
  importance: 3
  locations:
    - { place: mudan, role: primary }
    - { place: nagasaki, role: origin }
    - { place: mudan, role: destination }
    - { place: shuri, role: secondary }
  relations:
    - { event: ryukyu-annexation, type: causes }
  perspectives:
    - view: indigenous
      text:
        zh-TW: 對排灣族而言，這是捍衛傳統領域、抵抗外來軍隊入侵的戰爭。
        en: For the Paiwan, this was a war to defend their traditional territory against an invading army.
  wikipedia: { en: Japanese invasion of Taiwan (1874), zh: 牡丹社事件 }

- id: sino-french-war-taiwan
  title: { zh-TW: 清法戰爭臺灣戰役, en: Keelung Campaign of the Sino-French War }
  summary:
    zh-TW: 清法戰爭期間法軍進攻雞籠與滬尾（淡水），在滬尾之役受挫，隨後封鎖臺灣並占領澎湖，直到1885年停戰。
    en: During the Sino-French War, French forces attacked Kelang and Hobe (Tamsui). They were checked at the Battle of Tamsui, then blockaded Taiwan and occupied Penghu until the 1885 ceasefire.
  start: { year: 1884, month: 8 }
  end: { year: 1885, month: 6 }
  precision: month
  categories: [war]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: keelung, role: primary }
    - { place: tamsui, role: primary }
    - { place: penghu, role: secondary }
  relations:
    - { event: taiwan-province, type: causes }
  wikipedia: { en: Keelung Campaign, zh: 清法戰爭 }

- id: taiwan-province
  title: { zh-TW: 臺灣建省, en: Taiwan becomes a province }
  summary:
    zh-TW: 清法戰爭後，清廷將臺灣自福建分出設省，首任巡撫劉銘傳推動鐵路、電報、清丈土地等建設，省會後來定於臺北。
    en: After the Sino-French War the Qing split Taiwan from Fujian as its own province. The first governor, Liu Mingchuan, built railways and telegraphs and resurveyed land; the capital was later fixed at Taipei.
  start: 1885
  end: 1887
  precision: year
  categories: [politics]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: taipei, role: primary }
  relations:
    - { event: qing-rule-taiwan, type: part_of }
  wikipedia: { en: Fujian-Taiwan Province, zh: 福建臺灣省 }

# ===== Japanese rule =============================================================

- id: treaty-of-shimonoseki
  title: { zh-TW: 馬關條約：臺灣割讓日本, en: Treaty of Shimonoseki cedes Taiwan }
  summary:
    zh-TW: 甲午戰爭戰敗後，清廷於馬關與日本簽約，將臺灣、澎湖永久割讓給日本。臺灣人民未被徵詢，消息傳來引發強烈反彈。
    en: After losing the First Sino-Japanese War, the Qing signed a treaty at Shimonoseki ceding Taiwan and Penghu to Japan in perpetuity. Taiwanese people were not consulted, and the news provoked fierce opposition.
  start: { year: 1895, month: 4, day: 17 }
  precision: day
  categories: [diplomacy]
  regions: [taiwan, japan, china]
  importance: 5
  locations:
    - { place: shimonoseki, role: primary }
    - { place: taiwan, role: secondary }
  relations:
    - { event: first-sino-japanese-war, type: caused_by }
    - { event: republic-of-formosa, type: causes }
    - { event: japanese-rule-taiwan, type: causes }
  wikipedia: { en: Treaty of Shimonoseki, zh: 馬關條約 }

- id: republic-of-formosa
  title: { zh-TW: 臺灣民主國, en: Republic of Formosa }
  summary:
    zh-TW: 為抵抗割讓，臺灣士紳成立「臺灣民主國」，以黃虎旗為國旗，是亞洲最早以「共和國」為名的政權之一。日軍登陸後迅速瓦解，抗日戰事延續至同年10月臺南失守。
    en: To resist cession, Taiwanese gentry declared the Republic of Formosa, with a yellow-tiger flag; it was among the first states in Asia to call itself a republic. It collapsed quickly after Japanese landings, though fighting continued until Tainan fell that October.
  start: { year: 1895, month: 5, day: 25 }
  end: { year: 1895, month: 10, day: 21 }
  precision: day
  categories: [politics, war]
  regions: [taiwan]
  importance: 4
  locations:
    - { place: taipei, role: primary }
    - { place: tainan, role: secondary }
  relations:
    - { event: japanese-rule-taiwan, type: precedes }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 被視為臺灣人首次嘗試以獨立國家形式自主決定命運。
        en: Seen as the first attempt by Taiwanese to decide their own fate as an independent state.
    - view: scholarly
      text:
        zh-TW: 也有學者指出，其主要領導者仍效忠清朝，建國更多是爭取外國干預、避免割讓的權宜之計。
        en: Some scholars note its leaders remained loyal to the Qing, and that the republic was mainly a device to win foreign intervention against cession.
  wikipedia: { en: Republic of Formosa, zh: 臺灣民主國 }

- id: japanese-rule-taiwan
  title: { zh-TW: 日治時期, en: Japanese rule of Taiwan }
  altNames:
    - { zh-TW: 日據時期, en: Japanese occupation period }
  summary:
    zh-TW: 臺灣成為日本第一個殖民地。總督府建立現代行政、戶籍、衛生、教育與鐵路體系，發展糖業與米作，但臺灣人在政治上受到差別待遇，武裝與非武裝抗日運動持續不斷。
    en: Taiwan became Japan's first colony. The Government-General built modern administration, household registration, public health, schools and railways and developed sugar and rice, but Taiwanese faced political discrimination, and armed and peaceful resistance continued throughout.
  start: 1895
  end: 1945
  precision: year
  categories: [dynasty]
  regions: [taiwan, japan]
  importance: 5
  locations:
    - { place: taipei, role: primary }
    - { place: tokyo, role: secondary }
  relations:
    - { event: roc-takes-over-taiwan, type: precedes }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 殖民統治帶來現代化建設，也伴隨壓迫與剝削；「日治」一詞較中性地描述這段時期。
        en: Colonial rule brought modernisation alongside oppression and exploitation; "Japanese rule" (日治) is the more neutral term for the period.
    - view: roc
      text:
        zh-TW: 過去官方多用「日據」，強調其為非法占據。
        en: Official usage long favoured "Japanese occupation" (日據), stressing illegitimate occupation.
  wikipedia: { en: Taiwan under Japanese rule, zh: 臺灣日治時期 }

- id: tapani-incident
  title: { zh-TW: 噍吧哖事件, en: Tapani incident }
  altNames:
    - { zh-TW: 西來庵事件, en: Seiraian incident }
  summary:
    zh-TW: 余清芳等人以西來庵為據點策劃武裝抗日，於噍吧哖一帶與日軍激戰，事後日本當局大規模逮捕審判，是日治時期最後一次大規模漢人武裝抗日。
    en: Yu Qingfang and others organised armed resistance from the Seiraian temple and fought Japanese forces around Tapani. Mass arrests and trials followed. It was the last large armed Han uprising against Japanese rule.
  start: { year: 1915, month: 7 }
  end: { year: 1915, month: 8 }
  precision: month
  categories: [war]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: yujing, role: primary }
    - { place: tainan, role: secondary }
  relations:
    - { event: japanese-rule-taiwan, type: part_of }
  wikipedia: { en: Tapani incident, zh: 噍吧哖事件 }

- id: taiwanese-cultural-association
  title: { zh-TW: 臺灣文化協會成立, en: Taiwanese Cultural Association founded }
  summary:
    zh-TW: 蔣渭水、林獻堂等人於大稻埕成立臺灣文化協會，透過演講、讀報與戲劇推動文化啟蒙，與臺灣議會設置請願運動共同構成非武裝抗日的主軸。
    en: Chiang Wei-shui, Lin Hsien-tang and others founded the Taiwanese Cultural Association in Dadaocheng. Through lectures, reading rooms and theatre it promoted cultural awakening and, with the petition for a Taiwanese parliament, led non-violent resistance to colonial rule.
  start: { year: 1921, month: 10, day: 17 }
  precision: day
  categories: [culture, democracy]
  regions: [taiwan]
  importance: 3
  locations:
    - { place: dadaocheng, role: primary }
  relations:
    - { event: japanese-rule-taiwan, type: part_of }
  wikipedia: { en: Taiwanese Cultural Association, zh: 臺灣文化協會 }

- id: wushe-incident
  title: { zh-TW: 霧社事件, en: Wushe incident }
  summary:
    zh-TW: 賽德克族馬赫坡社頭目莫那・魯道率族人於霧社公學校運動會襲擊日人，日本當局以軍警、飛機甚至毒氣反擊，參與部落死傷慘重，倖存者被強制遷居。
    en: Mona Rudao, chief of the Seediq village of Mahebu, led an attack on Japanese at a school sports day in Wushe. The authorities struck back with troops, police, aircraft and poison gas; the villages involved suffered terrible losses and survivors were forcibly relocated.
  start: { year: 1930, month: 10, day: 27 }
  end: { year: 1930, month: 12 }
  precision: day
  categories: [war]
  regions: [taiwan]
  importance: 4
  locations:
    - { place: wushe, role: primary }
  relations:
    - { event: japanese-rule-taiwan, type: part_of }
  perspectives:
    - view: indigenous
      text:
        zh-TW: 對賽德克族而言，這是為尊嚴與祖靈信仰（Gaya）而戰的抵抗行動。
        en: For the Seediq, it was resistance fought for dignity and ancestral law (Gaya).
  wikipedia: { en: Musha incident, zh: 霧社事件 }

# ===== After 1945 ================================================================

- id: roc-takes-over-taiwan
  title: { zh-TW: 中華民國接管臺灣, en: ROC takes control of Taiwan }
  altNames:
    - { zh-TW: 臺灣光復, en: Retrocession }
    - { zh-TW: 終戰, en: End of the war }
  summary:
    zh-TW: 日本戰敗後，中華民國政府依盟軍統帥部命令於臺北公會堂接受日軍投降，隨即將臺灣納入行政管轄並設臺灣省行政長官公署。接收後的貪腐、物價飛漲與歧視迅速引發民怨。
    en: After Japan's defeat, the Republic of China accepted the Japanese surrender in Taipei under Allied orders and immediately placed Taiwan under its administration with a Governor-General's office. Corruption, soaring prices and discrimination after the takeover quickly bred public anger.
  start: { year: 1945, month: 10, day: 25 }
  precision: day
  categories: [politics]
  regions: [taiwan, china]
  importance: 5
  locations:
    - { place: taipei, role: primary }
  relations:
    - { event: pacific-war, type: caused_by }
    - { event: incident-228, type: causes }
    - { event: treaty-of-san-francisco, type: related }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 此為代表盟軍的軍事接管，並未發生主權移轉；日本直到1952年生效的《舊金山和約》才放棄臺灣主權，且未指定歸屬對象。
        en: This was a military takeover on behalf of the Allies, not a transfer of sovereignty. Japan renounced Taiwan only in the San Francisco Peace Treaty, effective 1952, without naming a recipient.
    - view: roc
      text:
        zh-TW: 中華民國稱之為「臺灣光復」，依《開羅宣言》與《波茨坦公告》收回臺灣，10月25日訂為光復節。
        en: The ROC calls it "Retrocession", the recovery of Taiwan under the Cairo Declaration and Potsdam Proclamation, and marks 25 October as Retrocession Day.
    - view: prc
      text:
        zh-TW: 中國官方視為臺灣「回歸中國」，並主張其主權由中華人民共和國繼承。
        en: Chinese official accounts call it Taiwan's "return to China" and claim the PRC inherited that sovereignty.
  wikipedia: { en: Retrocession Day, zh: 臺灣光復 }

- id: incident-228
  title: { zh-TW: 二二八事件, en: 228 Incident }
  summary:
    zh-TW: 臺北查緝私菸引發的衝突迅速擴大為全島性的抗爭。國民政府自中國調派軍隊來臺鎮壓，並展開「清鄉」，大批臺灣菁英與平民遇害；行政院研究報告估計死亡人數約一萬八千至二萬八千人。
    en: A clash over contraband cigarettes in Taipei grew into island-wide protest. The Nationalist government sent troops from China to suppress it and then carried out "village clearing" purges; many Taiwanese leaders and civilians were killed. An Executive Yuan report estimated 18,000–28,000 deaths.
  start: { year: 1947, month: 2, day: 27 }
  end: { year: 1947, month: 5, day: 16 }
  precision: day
  categories: [war, democracy]
  regions: [taiwan]
  importance: 5
  locations:
    - { place: taipei, role: primary }
    - { place: kaohsiung, role: secondary }
    - { place: chiayi, role: secondary }
    - { place: keelung, role: secondary }
  relations:
    - { event: white-terror, type: precedes }
  wikipedia: { en: February 28 incident, zh: 二二八事件 }
  sources:
    - { resource: memorial-228 }

- id: martial-law
  title: { zh-TW: 臺灣戒嚴, en: Martial law in Taiwan }
  summary:
    zh-TW: 臺灣省警備總司令部宣布全省戒嚴，持續至1987年7月15日解除，長達38年，是當時世界上最長的戒嚴之一。期間禁止組黨、限制言論與出版自由。
    en: The Taiwan Garrison Command declared martial law across the island. It lasted 38 years, until 15 July 1987, one of the longest periods of martial law in the world at the time. New parties were banned and speech and publishing restricted.
  start: { year: 1949, month: 5, day: 20 }
  end: { year: 1987, month: 7, day: 15 }
  precision: day
  categories: [politics, democracy]
  regions: [taiwan]
  importance: 5
  locations:
    - { place: taipei, role: primary }
  relations:
    - { event: white-terror, type: has_part }
    - { event: roc-government-retreat, type: related }
  wikipedia: { en: Martial law in Taiwan, zh: 臺灣省戒嚴令 }

- id: white-terror
  title: { zh-TW: 白色恐怖, en: White Terror }
  summary:
    zh-TW: 國民黨政府以「肅清匪諜」為名，大規模逮捕、審判與處決政治異議者。據估計約有十四萬人遭政治審判，數千人遭處決，綠島等地設有政治犯監獄。直到1992年修正刑法第100條才告一段落。
    en: In the name of rooting out communist spies, the KMT government arrested, tried and executed political dissidents on a large scale. An estimated 140,000 people faced political trials and thousands were executed; prisons for political prisoners included Green Island. It largely ended with the 1992 amendment of Criminal Code Article 100.
  start: 1949
  end: 1992
  precision: year
  categories: [democracy, politics]
  regions: [taiwan]
  importance: 5
  locations:
    - { place: taipei, role: primary }
    - { place: green-island, role: secondary }
  relations:
    - { event: martial-law, type: part_of }
  wikipedia: { en: White Terror (Taiwan), zh: 臺灣白色恐怖時期 }
  sources:
    - { resource: nhrm }

- id: roc-government-retreat
  title: { zh-TW: 中華民國政府遷臺, en: ROC government retreats to Taiwan }
  summary:
    zh-TW: 國共內戰失利後，中華民國政府將中央政府遷至臺北，約百萬軍民隨之來臺。此後中華民國的實際統治範圍主要限於臺澎金馬。
    en: After losing the Chinese Civil War, the ROC moved its central government to Taipei, and around a million soldiers and civilians came with it. From then on the ROC actually governed only Taiwan, Penghu, Kinmen and Matsu.
  start: { year: 1949, month: 12, day: 7 }
  precision: day
  categories: [politics, migration]
  regions: [taiwan, china]
  importance: 5
  locations:
    - { place: chengdu, role: origin }
    - { place: taipei, role: destination }
    - { place: taipei, role: primary }
  relations:
    - { event: prc-founded, type: related }
    - { event: battle-of-guningtou, type: related }
  wikipedia: { en: Retreat of the government of the Republic of China to Taiwan, zh: 中華民國政府遷臺 }

- id: battle-of-guningtou
  title: { zh-TW: 古寧頭戰役, en: Battle of Guningtou }
  summary:
    zh-TW: 中國人民解放軍渡海進攻金門，在古寧頭一帶被國軍擊敗，此役阻止了解放軍進一步攻取金門與臺灣。
    en: The People's Liberation Army crossed to attack Kinmen and was defeated around Guningtou, halting its advance on Kinmen and Taiwan.
  start: { year: 1949, month: 10, day: 25 }
  end: { year: 1949, month: 10, day: 27 }
  precision: day
  categories: [war]
  regions: [taiwan, china]
  importance: 3
  locations:
    - { place: kinmen, role: primary }
    - { place: xiamen, role: origin }
    - { place: kinmen, role: destination }
  wikipedia: { en: Battle of Guningtou, zh: 古寧頭戰役 }

- id: treaty-of-san-francisco
  title: { zh-TW: 舊金山和約, en: Treaty of San Francisco }
  summary:
    zh-TW: 二戰同盟國與日本簽訂和約，日本放棄對臺灣及澎湖的一切權利，但條約並未指定臺灣歸屬，中華民國與中華人民共和國皆未受邀簽署。
    en: The Allies signed a peace treaty with Japan. Japan renounced all claims to Taiwan and Penghu, but the treaty did not say to whom; neither the ROC nor the PRC was invited to sign.
  start: { year: 1951, month: 9, day: 8 }
  end: { year: 1952, month: 4, day: 28 }
  precision: day
  categories: [diplomacy]
  regions: [taiwan, japan, world]
  importance: 4
  locations:
    - { place: san-francisco, role: primary }
    - { place: taiwan, role: secondary }
  relations:
    - { event: pacific-war, type: caused_by }
    - { event: treaty-of-taipei, type: related }
  perspectives:
    - view: taiwan
      text:
        zh-TW: 條約未指定臺灣歸屬，是「臺灣地位未定論」與臺灣人民自決主張的重要法理依據。
        en: Because the treaty named no recipient, it is a key legal basis for the "undetermined status" argument and for Taiwanese self-determination.
    - view: roc
      text:
        zh-TW: 中華民國認為臺灣主權已依《中日和約》等文件歸還中華民國。
        en: The ROC holds that sovereignty over Taiwan returned to it through the Treaty of Taipei and related documents.
    - view: prc
      text:
        zh-TW: 中華人民共和國不承認舊金山和約，主張依開羅宣言與波茨坦公告，臺灣已歸還中國。
        en: The PRC does not recognise the treaty and holds that Taiwan was returned to China under the Cairo Declaration and Potsdam Proclamation.
  wikipedia: { en: Treaty of San Francisco, zh: 舊金山和約 }

- id: treaty-of-taipei
  title: { zh-TW: 中日和約, en: Treaty of Taipei }
  summary:
    zh-TW: 中華民國與日本簽訂和約，再次確認日本放棄臺灣、澎湖的權利，但同樣未明文規定由誰取得。1972年日本與中華人民共和國建交後，日方視此約失效。
    en: The ROC and Japan signed a peace treaty that again confirmed Japan's renunciation of Taiwan and Penghu, but again did not state who received them. Japan treated it as void after recognising the PRC in 1972.
  start: { year: 1952, month: 4, day: 28 }
  precision: day
  categories: [diplomacy]
  regions: [taiwan, japan]
  importance: 3
  locations:
    - { place: taipei, role: primary }
  wikipedia: { en: Treaty of Taipei, zh: 中日和約 }

- id: second-taiwan-strait-crisis
  title: { zh-TW: 八二三砲戰, en: Second Taiwan Strait Crisis }
  summary:
    zh-TW: 中國人民解放軍對金門展開大規模砲擊，44天內發射近50萬發砲彈。美國協助運補，危機最終以中國改為「單打雙不打」告終。
    en: The PLA launched a massive artillery bombardment of Kinmen, firing nearly half a million shells in 44 days. The US helped resupply the island, and the crisis ended with China switching to shelling on alternate days.
  start: { year: 1958, month: 8, day: 23 }
  end: { year: 1958, month: 10 }
  precision: day
  categories: [war]
  regions: [taiwan, china]
  importance: 3
  locations:
    - { place: kinmen, role: primary }
    - { place: xiamen, role: secondary }
  wikipedia: { en: Second Taiwan Strait Crisis, zh: 八二三砲戰 }

- id: un-resolution-2758
  title: { zh-TW: 聯合國大會第2758號決議, en: UN General Assembly Resolution 2758 }
  summary:
    zh-TW: 聯合國大會決議由中華人民共和國取代中華民國在聯合國的「中國」代表權。決議文並未提及臺灣，中華民國隨即退出聯合國。
    en: The UN General Assembly gave China's seat to the People's Republic of China in place of the Republic of China. The resolution does not mention Taiwan; the ROC withdrew from the UN.
