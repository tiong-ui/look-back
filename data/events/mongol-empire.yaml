summary:
  zh-TW: 鐵木真統一蒙古各部，被尊為成吉思汗。蒙古帝國其後成為史上陸地面積最大的連續帝國，忽必烈於1271年建立元朝。
  en: Temüjin united the Mongol tribes and was proclaimed Genghis Khan. The Mongol Empire became the largest contiguous land empire in history; Kublai Khan founded the Yuan dynasty in 1271.
