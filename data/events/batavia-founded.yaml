id: batavia-founded
title:
  zh-TW: 荷蘭建立巴達維亞
  en: Dutch found Batavia
summary:
  zh-TW: 荷蘭東印度公司總督科恩攻下雅加達，在原地建立巴達維亞城（今雅加達），作為公司在亞洲的總部。荷蘭在臺灣的大員商館也受巴達維亞指揮。
  en: VOC Governor-General Jan Pieterszoon Coen seized Jayakarta and built Batavia (now Jakarta) as the company's Asian headquarters. The Dutch post at Tayouan in Taiwan answered to Batavia.
