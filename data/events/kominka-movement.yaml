importance: 3
locations:
- place: taiwan
  role: primary
relations:
- event: japanese-rule-taiwan
  type: part_of
- event: second-sino-japanese-war
  type: related
perspectives:
- view: taiwan
  text:
    zh-TW: 這是要抹去臺灣人原有語言、信仰與認同的強制同化政策。
    en: A forced assimilation policy that sought to erase Taiwanese languages, beliefs and identity.
- view: japan
  text:
    zh-TW: 當時的官方說法是「一視同仁」，要讓臺灣人成為與日本人平等的帝國臣民。
    en: Officially presented as equal treatment, making Taiwanese full imperial subjects alongside Japanese.
- view: scholarly
  text:
    zh-TW: 學界指出，運動在都市與受教育階層影響較深，在鄉村的實際成效有限。
    en: Historians note its effects ran deeper in cities and among the educated than in the countryside.
