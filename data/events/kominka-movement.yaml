id: kominka-movement
title:
  zh-TW: 皇民化運動
  en: Kōminka movement
summary:
  zh-TW: 中日戰爭爆發後，總督府推動「皇民化運動」：廢除報紙漢文欄、推行「國語（日語）家庭」、鼓勵改日本姓名（1940年起）、要求參拜神社，要臺灣人成為「天皇的子民」以支援戰爭。
  en: 'After war with China broke out, the colonial government launched the kōminka ("imperial subject") campaign: Chinese-language newspaper sections were abolished, Japanese-speaking households promoted, Japanese names encouraged from 1940, and shrine worship required, to make Taiwanese loyal subjects for the war effort.'
start:
  year: 1937
end:
  year: 1945
precision: year
categories:
