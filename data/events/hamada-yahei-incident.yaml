id: hamada-yahei-incident
title:
  zh-TW: 濱田彌兵衛事件
  en: Hamada Yahei incident
summary:
  zh-TW: 日本朱印船船長濱田彌兵衛不滿荷蘭東印度公司在大員向日本商人課稅並限制貿易，在大員挾持荷蘭長官奴易茲（Pieter Nuyts）。事後日本中止荷蘭在平戶的貿易，直到荷方交出奴易茲才恢復。
  en: Angered by Dutch East India Company taxes and trade limits on Japanese merchants at Tayouan, the Japanese captain Hamada Yahei took the Dutch governor Pieter Nuyts hostage. Japan then halted Dutch trade at Hirado until the Dutch handed Nuyts over.
