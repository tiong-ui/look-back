id: bayao-bay-incident
title:
  zh-TW: 八瑤灣事件
  en: Bayao Bay incident
summary:
  zh-TW: 琉球宮古島的船隻遇颱風漂流到臺灣東南部的八瑤灣，66名船員上岸後進入排灣族部落，其中54人遭殺害，倖存的12人在當地漢人協助下輾轉返回琉球。日本日後以此為由出兵臺灣。
  en: A ship from Miyako in Ryukyu was blown by a typhoon to Bayao Bay in southeastern Taiwan. Of the 66 sailors who came ashore into Paiwan territory, 54 were killed; the 12 survivors made their way home with help from local Han settlers. Japan later used this as grounds to send troops to Taiwan.
