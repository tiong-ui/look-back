  text:
    zh-TW: 排灣族口述與近年研究指出，雙方語言不通、對部落待客習俗的誤解，是衝突的重要原因。
    en: Paiwan oral history and recent research point to the language barrier and misunderstandings of village customs of hospitality as major causes of the killings.
