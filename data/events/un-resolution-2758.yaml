importance: 4
locations:
  - place: new-york
    role: primary
  - place: taipei
    role: secondary
perspectives:
  - view: taiwan
    text:
      zh-TW: 決議只處理「中國代表權」，未決定臺灣地位，也未授權中華人民共和國代表臺灣人民。
      en: The resolution dealt only with who represents China. It did not decide Taiwan's status or authorise the PRC to represent Taiwan's people.
  - view: prc
    text:
      zh-TW: 中國主張此決議已確認臺灣是中國的一部分，並以此反對臺灣參與國際組織。
      en: China claims the resolution confirmed Taiwan is part of China and uses it to oppose Taiwan's participation in international bodies.
