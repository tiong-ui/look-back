title:
  zh-TW: 三佛齊
  en: Srivijaya
summary:
  zh-TW: 以蘇門答臘巨港為中心的海洋強權，控制麻六甲海峽的貿易，也是佛教學術中心，唐朝僧人義淨曾在此停留。
  en: A maritime power centred on Palembang in Sumatra that controlled trade through the Strait of Malacca. It was also a centre of Buddhist learning where the Tang monk Yijing stayed.
