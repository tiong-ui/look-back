id: wushe-incident
title:
  zh-TW: 霧社事件
  en: Wushe incident
summary:
  zh-TW: 賽德克族馬赫坡社頭目莫那・魯道率族人於霧社公學校運動會襲擊日人，日本當局以軍警、飛機甚至毒氣反擊，參與部落死傷慘重，倖存者被強制遷居。
  en: Mona Rudao, chief of the Seediq village of Mahebu, led an attack on Japanese at a school sports day in Wushe. The authorities struck back with troops, police, aircraft and poison gas; the villages involved suffered terrible losses and survivors were forcibly relocated.
