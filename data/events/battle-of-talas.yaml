summary:
  zh-TW: 唐朝與阿拔斯王朝在中亞怛羅斯河畔交戰，唐軍戰敗。傳說被俘的唐朝工匠將造紙術傳入伊斯蘭世界。
  en: Tang and Abbasid forces clashed by the Talas River in Central Asia, and the Tang lost. Tradition holds that captured Tang craftsmen brought papermaking to the Islamic world.
