summary:
  zh-TW: 西班牙與葡萄牙簽訂《薩拉戈薩條約》，在亞洲劃出分界線：西班牙放棄對摩鹿加群島（香料群島）的主張，由葡萄牙支付賠償。
  en: "Spain and Portugal drew a dividing line in Asia: Spain gave up its claim to the Moluccas (the Spice Islands) in return for a payment from Portugal."
