id: new-amsterdam-to-new-york
title:
  zh-TW: 新阿姆斯特丹被英國奪取，改名紐約
  en: New Amsterdam becomes New York
summary:
  zh-TW: 英國艦隊兵臨新阿姆斯特丹，荷蘭總督投降，城市改名紐約。1667年英荷簽訂《布雷達條約》，荷蘭正式放棄新尼德蘭，換得南美洲的蘇利南。
  en: An English fleet arrived at New Amsterdam and the Dutch governor surrendered; the town was renamed New York. In the 1667 Treaty of Breda the Dutch gave up New Netherland and kept Suriname in South America.
