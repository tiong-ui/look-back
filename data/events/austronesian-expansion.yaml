id: austronesian-expansion
title:
  zh-TW: 南島語族自臺灣向外擴散
  en: Austronesian expansion from Taiwan
altNames:
  - zh-TW: 出臺灣說
    en: Out of Taiwan model
summary:
  zh-TW: 依語言學與考古學的主流假說，南島語族自臺灣出發，經菲律賓擴散至東南亞島嶼、太平洋與印度洋，成為世界上分布最廣的語族之一。臺灣原住民族語言保存了南島語最古老的分支。
  en: In the leading linguistic and archaeological model, Austronesian speakers set out from Taiwan through the Philippines into Island Southeast Asia, the Pacific and the Indian Ocean, becoming one of the most widespread language families. Taiwan's Indigenous languages preserve its oldest branches.
