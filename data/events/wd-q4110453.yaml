title:
  zh-TW: 葡萄牙攻下麻六甲
  en: Portuguese capture of Malacca
summary:
  zh-TW: 阿爾布克爾克率葡萄牙艦隊攻下麻六甲蘇丹國的首都，控制了連接印度洋與南海的麻六甲海峽，葡萄牙由此打開通往中國與香料群島的門戶。
  en: Afonso de Albuquerque captured the capital of the Malacca Sultanate, giving Portugal control of the strait between the Indian Ocean and the South China Sea and a gateway to China and the Spice Islands.
