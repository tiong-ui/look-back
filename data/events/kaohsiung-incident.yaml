summary:
  zh-TW: 《美麗島》雜誌社於世界人權日在高雄舉行遊行，遭軍警包圍並爆發衝突。黨外領袖遭大規模逮捕與軍法審判，辯護律師團與受刑人家屬後來成為民主運動的中堅。
  en: Formosa magazine held a Human Rights Day rally in Kaohsiung, which was surrounded by troops and police and ended in clashes. Opposition leaders were rounded up and court-martialled; their defence lawyers and families later became the core of the democracy movement.
