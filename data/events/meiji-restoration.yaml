  en: Meiji Restoration
summary:
  zh-TW: 幕府倒台、天皇親政，日本全面推動西化與工業化，迅速成為東亞強權，並開始向外擴張，包括琉球、臺灣與朝鮮。
  en: The shogunate fell and imperial rule was restored. Japan pushed through Westernisation and industrialisation, quickly became East Asia's leading power and began expanding, including into Ryukyu, Taiwan and Korea.
