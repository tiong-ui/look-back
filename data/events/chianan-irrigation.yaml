id: chianan-irrigation
title:
  zh-TW: 嘉南大圳與烏山頭水庫
  en: Chianan Irrigation and Wushantou Reservoir
summary:
  zh-TW: 由技師八田與一設計的嘉南大圳於1920年動工、1930年完工，灌溉嘉南平原約十五萬甲農田，使這裡成為臺灣主要的稻米與甘蔗產區。
  en: Designed by engineer Hatta Yoichi, the Chianan irrigation system was built from 1920 to 1930. It watered about 150,000 hectares of the Chianan Plain, making it Taiwan's main rice and sugarcane region.
