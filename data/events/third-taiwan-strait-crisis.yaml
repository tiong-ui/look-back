id: third-taiwan-strait-crisis
title:
  zh-TW: 第三次臺海危機
  en: Third Taiwan Strait Crisis
summary:
  zh-TW: 李登輝訪美後，中國在臺灣周邊試射飛彈並舉行軍演，試圖影響臺灣首次總統直選；美國派遣兩個航艦戰鬥群前往臺灣附近。
  en: After Lee Teng-hui visited the US, China test-fired missiles and held exercises near Taiwan to sway its first direct presidential election; the US sent two carrier battle groups to the area.
