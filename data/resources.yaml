# 參考資源 Resources
#
# The list of reference sources for Look Back. It is shown in the app under
# "參考資源 / Resources", and events can cite an entry by its id:
#
#   sources:
#     - { resource: nmth, url: "https://…specific page…" }
#
# Add, edit or remove entries at any time; the data build checks that every
# `resource:` an event cites still exists.
#
# Fields: id (unique, kebab-case), name {zh-TW, en}, url (optional for books),
#         type (see resourceTypes in config.yaml), lang (content languages),
#         description {zh-TW, en} (optional)

# --- Encyclopedias -------------------------------------------------------------
- id: wikipedia-zh
  name: { zh-TW: 維基百科（中文）, en: Wikipedia (Chinese) }
  url: https://zh.wikipedia.org/
  type: encyclopedia
  lang: [zh]
  description: { zh-TW: 事件條目與重要度指標（瀏覽量）來源。, en: Event articles; page views feed the importance score. }
- id: wikipedia-en
  name: { zh-TW: 維基百科（英文）, en: Wikipedia (English) }
  url: https://en.wikipedia.org/
  type: encyclopedia
  lang: [en]
  description: { zh-TW: 事件條目與重要度指標（瀏覽量）來源。, en: Event articles; page views feed the importance score. }
- id: britannica
  name: { zh-TW: 大英百科全書, en: Encyclopaedia Britannica }
